# SUPER+[/] is the primary-axis scroller navigation. The dispatch picks
# LEFT/RIGHT on a horizontal-scroller tag and UP/DOWN on a vertical-scroller
# tag, so the same chord works on both layouts. arg->i: backward/forward.
bind=SUPER,bracketleft,scroller_axis_navigate,backward
bind=SUPER,bracketright,scroller_axis_navigate,forward
bind=SUPER+CTRL,H,exchange_client,left
bind=SUPER+CTRL,L,exchange_client,right
bind=SUPER+CTRL,K,exchange_client,up
bind=SUPER+CTRL,J,exchange_client,down
bind=SUPER+CTRL,p,switch_proportion_preset
bind=SUPER,u,viewtoright
bind=SUPER,i,viewtoleft
bind=SUPER+CTRL,u,tagtoright
bind=SUPER+CTRL,i,tagtoleft

# Hot-reload the mango config without restarting the session.
# The system config (/etc/mango/config.conf) ships SUPER+r for this, but our
# user config never sources that file, so the bind never reaches mango.
bind=SUPER,r,reload_config
# Bounded Niri actions. Existing DMS focus/exchange bindings are retained.
bind=SUPER+CTRL+ALT,Left,scroller_stack,left
bind=SUPER+CTRL+ALT,Right,scroller_stack,right
bind=SUPER+CTRL+ALT,Up,scroller_stack,up
bind=SUPER+CTRL+ALT,Down,scroller_stack,down
bind=SUPER+SHIFT,f,toggle_full_width_column
bind=SUPER+SHIFT,comma,adjust_column_size,-5%
bind=SUPER+SHIFT,period,adjust_column_size,+5%
bind=SUPER,s,setlayout,scroller
bind=SUPER+SHIFT,s,setlayout,vertical_scroller
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
