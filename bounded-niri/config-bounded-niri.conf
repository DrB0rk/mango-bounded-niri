# DankMaterialShell — MangoWM configuration (managed by `dms setup`)
# Keybinds, colors, layout, outputs, cursor and window rules are pulled from the
# ./dms fragments below. Add your own binds/rules here; they sit alongside DMS's.

env=XDG_CURRENT_DESKTOP,mango
env=XDG_SESSION_TYPE,wayland

# exec-once runs only at startup. Do NOT use exec= for the shell: mango re-runs
# every exec= on each config reload, and DMS reloads the config, which would
# spawn a new shell on every reload.
exec-once=dms run

source=./dms/colors.conf
source=./dms/layout.conf
source=./dms/cursor.conf
source=./dms/outputs.conf
source=./dms/windowrules.conf
source=./dms/binds.conf

# Rotated Niri-style scroller profile for DP-6. The strip runs vertically;
# each scroller row can contain horizontally tiled windows via scroller_stack.
scroller_structs=0
scroller_proportion_preset=0.5,1.0
scroller_prefer_overspread=0
scroller_focus_center=0
scroller_prefer_center=0
# Keep pointer focus for fully visible windows, but do not let hovering a
# partially off-screen scroller client trigger pointer-driven scrolling.
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
# Window reordering/movement is keyboard-only; mouse drag-to-tile is disabled.
drag_tile_to_tile=1
drag_tile_small=1
# Bounded-Niri drag preview: strip width (fraction of target's primary axis)
# shown when a drop inserts a new scroller column beside the target.
drop_strip_ratio=0.25
sloppyfocus=1
scroller_default_proportion_single=1.0
scroller_ignore_proportion_single=0
focus_cross_monitor=0
exchange_cross_monitor=0
focus_cross_tag=0
tag_carousel=0
animations=1
animation_duration_move=250
animation_duration_tag=250
animation_curve_move=0.46,1.0,0.29,0.99
animation_curve_tag=0.46,1.0,0.29,0.99
tag_animation_direction=0
scroller_default_proportion=0.5
# Bounded Niri mechanics implemented by the user-local Mango build.
scroller_niri_view=1
scroller_stack_max=2
scroller_auto_stack_every=3
scroller_min_proportion=0.5
scroller_pointer_focus_mode=keep-view
scroller_restore_stack_after_maximize=1
# Closest-gap DnD and continuous camera gestures still require the remaining
# source work; keep these disabled rather than exposing a false capability.
scroller_niri_gap_drop=0
scroller_view_gesture_fingers=0
scroller_dnd_edge_scroll=0
warpcursor=0
